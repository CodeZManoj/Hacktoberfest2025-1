<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Developer Card</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="card-container">
    <section class="profile-card">
      <img src="./assets/images/avatar.png" alt="Your Name" class="avatar" />
      <h1 class="name">Your Name</h1>
      <h2 class="title">Frontend Developer</h2>
      <p class="bio">
        Passionate about open source and creating responsive web experiences.
      </p>

      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>

      <div class="links">
        <a href="https://github.com/your-username" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/your-linkedin" target="_blank">LinkedIn</a>
      </div>
    </section>
  </main>

  <!-- Optional JS for animations -->
  <script src="./js/main.js"></script>
</body>
</html>
